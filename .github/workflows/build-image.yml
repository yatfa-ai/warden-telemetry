# Enqueues an in-cluster release Job on push to `prod` (or workflow_dispatch),
# then exits. The release Job (deployment/release/release-job.yaml.template)
# does the entire build + deploy inside the cluster: spawns the kaniko build of
# the receiver, waits, pins deployment/warden-telemetry to the exact sha. GHA
# runs for ~10 seconds regardless of build duration.
#
# Why not wait in GHA: GitHub Actions bills per minute. A multi-minute kaniko
# build × N releases/month is real money for nothing — the build is fully
# observable via `kubectl logs job/warden-telemetry-release-<sha>` in-cluster.
# (Same rationale + structure as yatfa / yatfa-router's build-image.yml.)
#
# Required repo secrets (copy from the yatfa repo — see deployment/release/README.md):
#   K8S_API_URL  - e.g. https://159.195.194.69:6443
#   K8S_CA       - cluster CA PEM (certificate-authority-data decoded)
#   K8S_TOKEN    - ServiceAccount token for the github-actions SA
#
# Required cluster objects (already present, shared with yatfa — nothing
# warden-telemetry-specific to create):
#   Secret/yatfa-github-app    — GitHub App PEM (yatfa-com), mounted by the
#                                in-cluster release Job to mint a 1h installation
#                                token and clone the repo. REQUIRES the App to be
#                                installed on yatfa-ai/warden-telemetry with contents:read.
#   ConfigMap/yatfa-config     — GH_APP_ID for the same mint.
#
# If the k8s creds are absent, the workflow no-ops (so feature branches don't
# fail when they lack prod secrets).
name: build-and-deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (default: prod)"
        required: false
        default: prod

permissions:
  contents: read

env:
  NAMESPACE: default

jobs:
  enqueue-release:
    runs-on: ubuntu-latest
    steps:
      - name: Gate on k8s creds
        id: gate
        env:
          K8S_API_URL: ${{ secrets.K8S_API_URL }}
          K8S_TOKEN: ${{ secrets.K8S_TOKEN }}
        run: |
          if [ -n "$K8S_API_URL" ] && [ -n "$K8S_TOKEN" ]; then
            echo "have_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No k8s secrets configured — skipping deploy"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.have_creds == 'true'
        with:
          fetch-depth: 0

      - name: Resolve ref + tag
        if: steps.gate.outputs.have_creds == 'true'
        id: meta
        run: |
          ref="${{ github.event.inputs.ref || 'prod' }}"
          tag="sha-${GITHUB_SHA::7}"
          {
            echo "ref=$ref"
            echo "tag=$tag"
            echo "short=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      - name: Configure kubectl
        if: steps.gate.outputs.have_creds == 'true'
        env:
          K8S_API_URL: ${{ secrets.K8S_API_URL }}
          K8S_CA: ${{ secrets.K8S_CA }}
          K8S_TOKEN: ${{ secrets.K8S_TOKEN }}
        run: |
          CA_B64="$(printf '%s' "$K8S_CA" | base64 -w 0)"
          mkdir -p "$HOME/.kube"
          cat > "$HOME/.kube/config" <<EOF
          apiVersion: v1
          kind: Config
          clusters:
          - name: new-cluster
            cluster:
              server: ${K8S_API_URL}
              certificate-authority-data: ${CA_B64}
          contexts:
          - name: github-actions@new-cluster
            context:
              cluster: new-cluster
              namespace: ${NAMESPACE}
              user: github-actions
          current-context: github-actions@new-cluster
          users:
          - name: github-actions
            user:
              token: ${K8S_TOKEN}
          EOF
          chmod 600 "$HOME/.kube/config"
          kubectl version --client

      - name: Enqueue in-cluster release Job
        if: steps.gate.outputs.have_creds == 'true'
        run: |
          job="warden-telemetry-release-${{ steps.meta.outputs.short }}"
          job="${job:0:63}"; job="${job%-}"
          if kubectl get job "$job" >/dev/null 2>&1; then
            echo "::notice::Release job $job already exists — skipping"
            exit 0
          fi

          REPO="github.com/${{ github.repository }}.git"
          sed \
            -e "s|__REL_JOB_NAME__|${job}|g" \
            -e "s|__REL_GIT_REF__|${{ steps.meta.outputs.ref }}|g" \
            -e "s|__REL_IMAGE_TAG__|${{ steps.meta.outputs.tag }}|g" \
            -e "s|__REL_SHORT_SHA__|${{ steps.meta.outputs.short }}|g" \
            -e "s|__REL_REPO_URL__|${REPO}|g" \
            deployment/release/release-job.yaml.template \
            | kubectl apply -f -

          echo "::notice::Enqueued $job — watch with: kubectl logs job/${job} -f"
          {
            echo "### warden-telemetry release enqueued"
            echo "- job: \`${job}\`"
            echo "- ref: \`${{ steps.meta.outputs.ref }}\`"
            echo "- image tag: \`sha-${{ steps.meta.outputs.short }}\`"
            echo ""
            echo "Watch in-cluster:"
            echo '```bash'
            echo "kubectl logs job/${job} -f"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
