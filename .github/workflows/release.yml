# Release warden-telemetry: bump the patch version, fast-forward `prod` to
# `main`, then dispatch the build-and-deploy workflow on prod. Mirrors
# yatfa-router's release.yml; the version lives in package.json (Node project),
# bumped by scripts/bump-version.sh — the same shape warden uses.
#
# Two triggers:
#   - workflow_dispatch — manual "Run workflow" from the Actions UI.
#   - schedule          — daily cron. The `gate` step below no-ops the whole
#                         job when prod is already at main (no new commits), so
#                         a quiet day rebuilds nothing AND bumps nothing — the
#                         version counts releases, not days. Runs from the default
#                         branch (main), so it only goes live once this file is
#                         on main.
#
# Deployment is not driven from here. Advancing `prod` is the whole signal, and
# the deploy side polls that branch — so a push made with GITHUB_TOKEN (which
# GitHub suppresses from spawning push-triggered workflows) is fine: nothing
# here depends on an event firing.
name: Release (Advance prod & Deploy)

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'   # daily ~05:23 Europe/Berlin; off the :00 herd

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        # scripts/bump-version.sh reads and rewrites package.json with node.
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Skip if prod already at main (no new commits)
        id: gate
        # fetch-depth: 0 above fetched every branch tip, so origin/prod is
        # resolvable here. When prod already matches main, the two deploy steps
        # below are skipped — a quiet day rebuilds and re-pins nothing.
        run: |
          if [ "$(git rev-parse origin/main)" = "$(git rev-parse origin/prod)" ]; then
            echo "ahead=false" >> "$GITHUB_OUTPUT"
            echo "prod already at main ($(git rev-parse --short origin/main)) — nothing to release"
          else
            echo "ahead=true" >> "$GITHUB_OUTPUT"
            echo "main ahead of prod: $(git rev-parse --short origin/prod) -> $(git rev-parse --short origin/main)"
          fi

      - name: Bump patch version (commit + tag + push to main)
        id: bump
        if: steps.gate.outputs.ahead == 'true'
        # Runs on the scheduled path too, so the version tracks releases without
        # anyone remembering to bump — same as yatfa. The gate above means a
        # quiet day bumps nothing: no new commits, no release, no version churn.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout main
          chmod +x scripts/bump-version.sh
          ./scripts/bump-version.sh

      - name: Fast-forward prod to main
        if: steps.gate.outputs.ahead == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout main
          git push origin main:prod

      # No deploy step: advancing `prod` IS the release signal. The deploy side
      # watches that branch and takes it from there, so this repo needs no
      # deployment credentials.
