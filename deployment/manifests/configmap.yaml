# Warden Telemetry non-secret runtime config.
# Consumed by deployment.yaml via envFrom configMapRef. See server.mjs for the
# full env reference (PORT / STORE / STORE_MAX_EVENTS / STORE_MAX_AGE_HOURS /
# INGEST_MAX_BODY_BYTES).
apiVersion: v1
kind: ConfigMap
metadata:
  name: warden-telemetry-config
  namespace: default
  labels:
    app: warden-telemetry
data:
  # Port a warden client's endpointUrl points at (origin port inside the pod;
  # the Service maps 80 → 7421).
  PORT: "7421"

  # Durable NDJSON store. Lives on the /data PVC (see deployment.yaml) so
  # accepted events survive restarts. MUST match the data volumeMount mountPath.
  STORE: "/data/telemetry.ndjson"

  # Retention COUNT cap — the persisted file compacts to the newest N events
  # once N is exceeded. 50k redacted ~1-2KB events ≈ ≤100 MiB; well under the
  # 512Mi PVC. `0` disables the cap (let the PVC bound it instead — not advised).
  STORE_MAX_EVENTS: "50000"

  # Retention AGE window (hours). Events older than now-minus-this are dropped on
  # compaction. `0` = off (rely on the count cap). Set e.g. "2160" (90d) to also
  # age out.
  STORE_MAX_AGE_HOURS: "0"

  # INGEST_MAX_BODY_BYTES is left at its default (1 MiB). Legit traffic is one
  # redacted event per dispatch (~1-2KB); 1 MiB is ~500x headroom. Set here only
  # to override.
