# Warden Telemetry receiver Deployment.
#
# Single replica: the durable store is an NDJSON file on a PVC (ReadWriteOnce),
# so this is the simplest correct footprint — one writer. (A multi-replica
# deploy would need a shared store / external DB, which is a later slice.)
#
# Mirrors the sibling yatfa-router Deployment structure.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warden-telemetry
  namespace: default
  labels:
    app: warden-telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: warden-telemetry
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never remove a ready pod before its replacement is ready.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: warden-telemetry
    spec:
      securityContext:
        # The image runs as the `node` user (UID/GID 1000). The /data PVC is
        # created root-owned by the local-path provisioner; without fsGroup the
        # node user (1000) can't create telemetry.ndjson in it → EACCES. Same
        # guard yatfa-router uses for its spill PVC.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: warden-telemetry
          # Bootstrap/fallback tag. PROD is re-pinned to an explicit `sha-<short>`
          # tag by deployment/kaniko/build.sh after each in-cluster Kaniko build.
          image: registry.tinkerai.win/warden-telemetry:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 7421
              name: http
          envFrom:
            - configMapRef:
                name: warden-telemetry-config
            - secretRef:
                name: warden-telemetry-secret
          # TCP-socket probe: every HTTP route (/ingest, /summary, /capabilities,
          # /events) is gated behind AUTH_TOKEN, so an HTTP probe would 401.
          # A socket-open check on 7421 proves the server bound its port and is
          # accepting connections — sufficient for a tiny plain-`http` server.
          readinessProbe:
            tcpSocket:
              port: 7421
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: 7421
            periodSeconds: 5
            failureThreshold: 30   # 5s × 30 = up to 2.5min for boot
          livenessProbe:
            tcpSocket:
              port: 7421
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          volumeMounts:
            # Durable home for the NDJSON event store. Survives pod restarts so
            # accepted events aren't lost on a rollout/crash/reschedule. The
            # STORE env var (configmap.yaml) points at /data/telemetry.ndjson —
            # this mountPath MUST match.
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: warden-telemetry-data
      imagePullSecrets:
        - name: yatfa-registry-pull
      terminationGracePeriodSeconds: 30
