# PersistentVolumeClaim for the durable NDJSON event store.
#
# Accepted telemetry events are persisted to STORE=/data/telemetry.ndjson on this
# volume. For the store to mean anything the file MUST survive a pod restart
# (deploy rollout, crash, OOMKill, node eviction, reschedule) — otherwise the
# receiver silently loses every event it ever accepted. Mounting this PVC at
# /data makes the store durable across restarts.
#
# ReadWriteOnce is correct and consistent with replicas: 1 in deployment.yaml —
# the single-writer footprint the NDJSON store assumes.
#
# Sized for STORE_MAX_EVENTS=50000 of ~1-2KB events (≤100 MiB) plus headroom.
# 512Mi is generous. storageClassName omitted → cluster default (local-path,
# WaitForFirstConsumer) — same convention as yatfa-router-ledger-spill.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: warden-telemetry-data
  namespace: default
  labels:
    app: warden-telemetry
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi
  # storageClassName omitted → cluster default StorageClass (dynamic provisioning).
