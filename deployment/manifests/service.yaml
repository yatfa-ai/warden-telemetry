# Warden Telemetry Service — exposes the receiver pods inside the cluster.
# Port 80 (origin HTTP) → targetPort 7421 (server.mjs default PORT).
# The Ingress fronts TLS via Cloudflare; origin is plain HTTP (mirrors the
# yatfa-ingress / yatfa-router-ingress pattern).
apiVersion: v1
kind: Service
metadata:
  name: warden-telemetry
  namespace: default
  labels:
    app: warden-telemetry
spec:
  type: ClusterIP
  selector:
    app: warden-telemetry
  ports:
    - name: http
      port: 80
      targetPort: 7421
      protocol: TCP
